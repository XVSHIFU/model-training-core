[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-training-core"
version = "0.1.0"
description = "Reusable training workflow, sparse classification backend and task adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "lightgbm>=4.0,<5",
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "brotli>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[project.scripts]
upload-judge = "upload_judge.cli:main"
model-workflow = "training_tasks.registry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
